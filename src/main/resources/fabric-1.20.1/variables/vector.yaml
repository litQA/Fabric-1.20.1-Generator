defaultvalue: Vec3.ZERO
scopes:
  local:
    init: ${var.getType().getJavaType(generator.getWorkspace())} ${var.getName()} = ${var.getType().getDefaultValue(generator.getWorkspace())};
    get: ${name}
    set: ${name} = ${opt.removeParentheses(value)};
  global_session:
    init: public static Vec3 ${var.getName()} = Vec3.ZERO;
    get: ${JavaModName}Variables.${name}
    set: ${JavaModName}Variables.${name} = ${opt.removeParentheses(value)};
  global_world:
    init: public Vec3 ${var.getName()} = Vec3.ZERO;
    read: ${var.getName()} = new Vec3(nbt.getDouble("${var.getName()}_x"), nbt.getDouble("${var.getName()}_y"), nbt.getDouble("${var.getName()}_z"));
    write: |
      nbt.putDouble("${var.getName()}_x", ${var.getName()}.x);
      nbt.putDouble("${var.getName()}_y", ${var.getName()}.y);
      nbt.putDouble("${var.getName()}_z", ${var.getName()}.z);
    get: ${JavaModName}Variables.WorldVariables.get(world).${name}
    set: |
      ${JavaModName}Variables.WorldVariables.get(world).${name} = ${opt.removeParentheses(value)};
      ${JavaModName}Variables.WorldVariables.get(world).syncData(world);
  global_map:
    init: public Vec3 ${var.getName()} = Vec3.ZERO;
    read: ${var.getName()} = new Vec3(nbt.getDouble("${var.getName()}_x"), nbt.getDouble("${var.getName()}_y"), nbt.getDouble("${var.getName()}_z"));
    write: |
      nbt.putDouble("${var.getName()}_x", ${var.getName()}.x);
      nbt.putDouble("${var.getName()}_y", ${var.getName()}.y);
      nbt.putDouble("${var.getName()}_z", ${var.getName()}.z);
    get: ${JavaModName}Variables.MapVariables.get(world).${name}
    set: |
      ${JavaModName}Variables.MapVariables.get(world).${name} = ${opt.removeParentheses(value)};
      ${JavaModName}Variables.MapVariables.get(world).syncData(world);
  player_lifetime:
    init: public Vec3 ${var.getName()} = Vec3.ZERO;
    read: ${var.getName()} = new Vec3(nbt.getDouble("${var.getName()}_x"), nbt.getDouble("${var.getName()}_y"), nbt.getDouble("${var.getName()}_z"));
    write: |
      nbt.putDouble("${var.getName()}_x", ${var.getName()}.x);
      nbt.putDouble("${var.getName()}_y", ${var.getName()}.y);
      nbt.putDouble("${var.getName()}_z", ${var.getName()}.z);
    get: ${JavaModName}Variables.getPlayerLifetimeVars(${entity}).${name}
    set: |
      <@head>{var _vars = ${JavaModName}Variables.getPlayerLifetimeVars(${entity});</@head>
      _vars.${name} = ${opt.removeParentheses(value)};
      <@tail>${JavaModName}Variables.syncPlayerVars(${entity});}</@tail>
  player_persistent:
    init: public Vec3 ${var.getName()} = Vec3.ZERO;
    read: ${var.getName()} = new Vec3(nbt.getDouble("${var.getName()}_x"), nbt.getDouble("${var.getName()}_y"), nbt.getDouble("${var.getName()}_z"));
    write: |
      nbt.putDouble("${var.getName()}_x", ${var.getName()}.x);
      nbt.putDouble("${var.getName()}_y", ${var.getName()}.y);
      nbt.putDouble("${var.getName()}_z", ${var.getName()}.z);
    get: ${JavaModName}Variables.getPlayerVars(${entity}).${name}
    set: |
      <@head>{var _vars = ${JavaModName}Variables.getPlayerVars(${entity});</@head>
      _vars.${name} = ${opt.removeParentheses(value)};
      <@tail>${JavaModName}Variables.syncPlayerVars(${entity});}</@tail>

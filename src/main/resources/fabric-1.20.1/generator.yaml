name: Fabric for @minecraft (@buildfileversion)
status: experimental
buildfileversion: 0.92.12
subversion: 27

import:
  - fabric-1.20.1-base/datapack
  - fabric-1.20.1-base/forge

java_models:
  key: mojmap-1.20.x
  compatible: [mojmap-1.17.x, mojmap-1.18.x, mojmap-1.19.x, mojmap-1.20.x]
  requested_key_words: [ModelPart, ~ModelRenderer]

# gradle task definitions
gradle:
  sync_task: genSourcesWithCfr
  run_client: runClient
  run_server: runServer
  export_file: "build/libs/modid-1.0.jar"

import_formatter:
  duplicates_whitelist:
    - java.util
    - net.minecraft
    - net.fabricmc
  priority_imports:
    Attributes: net.minecraft.world.entity.ai.attributes
    Nullable: javax.annotation
    Codec: com.mojang.serialization
    SoundEvent: net.minecraft.sounds
    Environment: net.fabricmc.api
    Blocks: net.minecraft.world.level.block
    Items: net.minecraft.world.item

# base generator roots
source_root: "@WORKSPACEROOT/src/main/java"
res_root: "@WORKSPACEROOT/src/main/resources"
mod_assets_root: "@RESROOT/assets/@modid"
mod_data_root: "@RESROOT/data/@modid"

# specific resource folders
sounds_dir: "@MODASSETSROOT/sounds"
structures_dir: "@MODDATAROOT/structures"
block_textures_dir: "@MODASSETSROOT/textures/block"
item_textures_dir: "@MODASSETSROOT/textures/item"
entity_textures_dir: "@MODASSETSROOT/textures/entities"
effect_textures_dir: "@MODASSETSROOT/textures/mob_effect"
particle_textures_dir: "@MODASSETSROOT/textures/particle"
screen_textures_dir: "@MODASSETSROOT/textures/screens"
armor_textures_dir: "@RESROOT/assets/minecraft/textures/models/armor"
other_textures_dir: "@MODASSETSROOT/textures"

# vanilla resources
vanilla_resources_jar: ".*-merged-.*.jar"
vanilla_block_textures_dir: "assets/minecraft/textures/block"
vanilla_item_textures_dir: "assets/minecraft/textures/item"

base_templates:
  - template: modbase/mod.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/@JavaModName.java"
  - template: modbase/client.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/@JavaModNameClient.java"
  - template: modbase/fabric.mod.json.ftl
    writer: json
    name: "@RESROOT/fabric.mod.json"
  - template: "modbase/pack.mcmeta.ftl"
    writer: json
    name: "@RESROOT/pack.mcmeta"
  - template: modbase/sounds.json.ftl
    writer: json
    name: "@MODASSETSROOT/sounds.json"
    condition: hasSounds()
  - template: elementinits/sounds.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameSounds.java"
    condition: hasSounds()
  - template: modbase/variableslist.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/network/@JavaModNameVariables.java"
    condition: hasVariables()
  - template: elementinits/javamodels.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameModels.java"
    condition_any:
      - hasJavaModels()
      - "${w.hasElementsOfType('specialentity')}"
  - template: modbase/.accesswidener.ftl
    writer: file
    name: "@RESROOT/@modid.accesswidener"

  - template: modbase/mixins.json.ftl
    writer: file
    name: "@RESROOT/@modid.mixins.json"

  - template: modbase/triggersupport.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/trigger/@JavaModNameTriggers.java"
  - template: modbase/craftingremainders.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameCraftingRemainders.java"
  - template: modbase/enchantmenteffects.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameEnchantmentEffects.java"
  - template: mixins/enchantmenthelpermixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNameEnchantmentHelperMixin.java"
  - template: mixins/itemstackattributemixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNameItemStackAttributeMixin.java"
  - template: mixins/livingentitymixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNameLivingEntityMixin.java"
  - template: mixins/craftingremaindermixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNameCraftingRemainderMixin.java"
  - template: mixins/explosionmixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNameExplosionMixin.java"
  - template: mixins/bucketfilledmixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNameBucketFilledMixin.java"
  - template: mixins/playeractionmixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNamePlayerActionMixin.java"
  - template: mixins/furnaceresultslotmixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNameFurnaceResultSlotMixin.java"
  - template: mixins/switchhandmixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixins/@JavaModNameSwitchHandMixin.java"

  - template: block/fence_tag.json.ftl
    writer: json
    name: "@RESROOT/data/minecraft/tags/blocks/fences.json"
  - template: block/wall_tag.json.ftl
    writer: json
    name: "@RESROOT/data/minecraft/tags/blocks/walls.json"

sources_setup_tasks:
  - task: copy_models
    type: JAVA_viatemplate
    template: javamodel.java.ftl
    to: "@SRCROOT/@BASEPACKAGEPATH/client/model"

tags:
  template: tags.json.ftl # loaded from datapack generator
  name: "@RESROOT/data/@namespace/tags/@folder_pre21/@name.json"

language_file:
  format: json
  root_folder: "@MODASSETSROOT/lang/"
  langfile_name: "@langname.json"

resources_setup_tasks:
  - task: copy_file
    from: "@MODASSETSROOT/textures/@modpicture.png"
    to: "@MODASSETSROOT/icon.png"
  - task: copy_models
    type: OBJ
    to: "@MODASSETSROOT/models/item"
  - task: copy_models
    type: JSON_noinlinetextures
    to: "@MODASSETSROOT/models/custom"
